schema_version = "1.0.0"
id = "blender_bridge"
version = "0.2.0"
name = "Blender Bridge"
tagline = "Verified reversible DCC control for Codex"
maintainer = "Rizek"
type = "add-on"
tags = ["Development"]
blender_version_min = "5.2.1"
